name: trooi-sepay-standalone
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trooi_sepay
      POSTGRES_PASSWORD: ${TROOI_STANDALONE_DB_PASSWORD:?Set the password in .env.sepay-standalone}
      POSTGRES_DB: trooi_sepay_isolated
    ports:
      - "127.0.0.1:55459:5432"
    volumes:
      - sepay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trooi_sepay -d trooi_sepay_isolated"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"
volumes:
  sepay_postgres_data:

name: Backend ERD3 Conformance

on:
  push:
    branches:
      - backend/core-foundations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Focused Identity boundary conformance
        run: pnpm exec tsx --test tests/conformance/erd3/identity.contract.test.ts

      - name: Database validators
        run: python -m unittest discover -s tests/database -p 'test_*.py'

      - name: Full ERD3 conformance baseline
        id: erd3
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:conformance:erd3 2>&1 | tee erd3-conformance.log

      - name: Assert full ERD3 baseline remains intentionally RED
        run: |
          if [ "${{ steps.erd3.outcome }}" = "success" ]; then
            echo "::error::ERD3 conformance unexpectedly went fully green; reconcile the handoff baseline before proceeding."
            exit 1
          fi
          if grep -Eq '^(not ok|# Subtest: not ok)|# fail [1-9][0-9]*' erd3-conformance.log; then
            echo "Observed expected remaining product/domain RED conformance."
            exit 0
          fi
          echo "::error::ERD3 command failed without an observable test failure."
          exit 1

      - name: Full repository test baseline
        id: full_test
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee full-test.log

      - name: Record expected full-test RED while ERD3 rebuild is incomplete
        run: |
          if [ "${{ steps.full_test.outcome }}" = "success" ]; then
            echo "Full repository test suite is green."
            exit 0
          fi
          if grep -Eq 'tests/conformance/erd3|ERD3|# fail [1-9][0-9]*|not ok' full-test.log; then
            echo "Full repository tests remain RED; inspect the uploaded log before handoff to verify failures are confined to expected ERD3 gaps."
            exit 0
          fi
          echo "::error::Full test command failed without recognizable test output."
          exit 1

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erd3-runtime-evidence-${{ github.sha }}
          path: |
            erd3-conformance.log
            full-test.log
          if-no-files-found: warn

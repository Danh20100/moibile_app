name: Infrastructure Foundation Verification

on:
  push:
    branches:
      - main
      - design/app-ui-redesign
    paths:
      - '.github/workflows/infrastructure-foundation.yml'
      - 'src/infrastructure/cache/**'
      - 'src/infrastructure/object-storage/**'
      - 'src/persistence/ports/cache.port.ts'
      - 'src/persistence/ports/object-storage.port.ts'
      - 'tests/integration/infrastructure/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'app/build.gradle.kts'
      - 'gradle.properties.example'
      - 'scripts/config/**'
      - 'tests/verification/configuration-completeness.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application and tests
        run: pnpm typecheck

      - name: Test infrastructure configuration and disabled adapters
        run: pnpm exec tsx --test tests/integration/infrastructure/*.test.ts

      - name: Enforce complete and isolated environment configuration
        run: pnpm exec tsx --test tests/verification/configuration-completeness.test.ts

      - name: Validate optional Compose syntax without starting services
        env:
          POSTGRES_USER: trooi_ci
          POSTGRES_PASSWORD: trooi_ci_only
          POSTGRES_DB: trooi_ci
          POSTGRES_TEST_DB: trooi_test_ci
          MINIO_ROOT_USER: trooi_ci
          MINIO_ROOT_PASSWORD: trooi_ci_password_only
        run: docker compose --env-file .env.example --profile local-infra --profile messaging-test --profile sepay-isolated --profile finance-production config -q

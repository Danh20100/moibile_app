name: Branch Flow Guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guard-main:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject landing-page changes targeting main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          blocked=false

          case "$HEAD_REF" in
            landing-page|feature/landing-*|fix/landing-*|hotfix/landing-*|chore/landing-*|docs/landing-*)
              blocked=true
              ;;
          esac

          files="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[].filename')"

          if printf '%s\n' "$files" | grep -Eq '^(dist/|vercel\.json$)'; then
            blocked=true
          fi

          if [ "$blocked" != "true" ]; then
            echo "PR does not contain landing-page deployment changes."
            exit 0
          fi

          body=$(cat <<'EOF'
          This PR targets `main`, but it contains landing-page changes.

          TrọƠi uses this branch flow:

          `feature/landing-*` / `fix/landing-*` / `hotfix/landing-*` → `landing-page`

          `landing-page` is the long-lived deployment branch for the marketing site and must not be merged into `main`.

          Please open the PR again with **base branch `landing-page`**.
          EOF
          )

          gh api \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="$body"

          gh api \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/pulls/$PR_NUMBER" \
            -f state='closed'

          echo "Closed invalid landing-page PR targeting main."

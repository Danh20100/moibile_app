name: Frontend Runtime Integration

on:
  push:
    branches:
      - frontend/full-stack-runtime-connection
      - design/app-ui-redesign
      - integration/full-stack-sync-runtime-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TROOI_API_BASE_URL: https://example.invalid/api/v1/
      TROOI_GOOGLE_WEB_CLIENT_ID: test-client.apps.googleusercontent.com
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Static architecture guard
        shell: bash
        run: |
          set -euo pipefail
          python3 app/scripts/verify_frontend_architecture.py
          if grep -R -n -E 'UserRole|RoomUi|BookingUi|SubscriptionPlan|backendUnavailable' app/src/main app/src/release; then exit 1; else test "$?" -eq 1; fi
          if grep -R -n -E 'import .*DemoData|DemoData\.' app/src/release; then exit 1; else test "$?" -eq 1; fi

      - name: Root Android test layout guard
        run: python3 scripts/verify_android_test_layout.py

      - name: Verify current documentation links
        run: python3 scripts/verify_docs_links.py --scope all

      - name: Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Verify JVM test discovery
        run: python3 scripts/verify_android_test_results.py

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Android assemble
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease --stacktrace

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-android-evidence-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
            app/build/outputs/bundle/
          if-no-files-found: warn

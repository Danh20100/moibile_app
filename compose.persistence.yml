services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trooi
      POSTGRES_PASSWORD: trooi_local
      POSTGRES_DB: trooi_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_persistence_data:/var/lib/postgresql/data
      - ./database/dev/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trooi -d trooi_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_persistence_data:

services:
  postgres:
    image: postgis/postgis:16-3.4
    profiles: [messaging]
    environment:
      POSTGRES_DB: messaging_test
      POSTGRES_USER: messaging_test
      POSTGRES_PASSWORD: local-messaging-test-only
    ports: ["127.0.0.1:55447:5432"]
    tmpfs: [/var/lib/postgresql/data]
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    profiles: [messaging]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: messaging-local
      MINIO_ROOT_PASSWORD: local-messaging-test-only
    ports: ["127.0.0.1:9047:9000", "127.0.0.1:9048:9001"]
    tmpfs: [/data]

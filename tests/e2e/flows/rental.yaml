feature: rental-lifecycle
flows:
  - id: TEN-01
    name: create-tenancy-draft
    actor: operator
    status: spec_only
    preconditions: [active-room, no-nonterminal-tenancy]
    steps: [create-tenancy]
    assertions: [tenancy-status-draft, linked-room-correct, one-nonterminal-tenancy-invariant]
  - id: PART-01
    name: add-primary-participant
    actor: operator
    status: spec_only
    preconditions: [draft-tenancy]
    steps: [add-primary-participant]
    assertions: [participant-row-created, role-primary, participant-can-exist-without-user]
  - id: PART-02
    name: add-occupant-and-leave
    actor: operator
    status: spec_only
    preconditions: [tenancy]
    steps: [add-occupant, record-leave]
    assertions: [participant-history-preserved, primary-invariant-unchanged]
  - id: PART-03
    name: link-participant-user
    actor: operator
    status: spec_only
    preconditions: [participant-without-user, existing-user]
    steps: [link-user]
    assertions:
      [optional-user-link-created, participant-identity-preserved, tenant-capability-derived]
  - id: TERMS-01
    name: create-initial-terms
    actor: operator
    status: spec_only
    preconditions: [draft-tenancy]
    steps: [record-terms-v1]
    assertions: [terms-version-one-created, monetary-and-date-fields-exact]
  - id: TERMS-02
    name: create-new-terms-version
    actor: operator
    status: spec_only
    preconditions: [existing-terms]
    steps: [create-new-version]
    assertions: [old-version-preserved, version-ordering-correct, billing-boundary-provenance-kept]
  - id: ACK-01
    name: acknowledge-terms-version
    actor: linked-participant-user
    status: spec_only
    preconditions: [linked-user, terms-version]
    steps: [open-terms, acknowledge-version]
    assertions:
      [acknowledgement-links-user-participant-terms, timestamp-persisted, no-cross-tenancy-link]
  - id: RENT-01
    name: activate-tenancy
    actor: operator
    status: spec_only
    preconditions: [draft-tenancy, exactly-one-active-primary, valid-terms, vacant-room]
    steps: [activate-tenancy]
    assertions: [tenancy-active, room-occupied, published-listing-unpublished, transaction-atomic]
  - id: RENT-02
    name: start-move-out
    actor: authorized-user
    status: spec_only
    preconditions: [active-tenancy]
    steps: [start-move-out]
    assertions: [tenancy-ending, room-not-vacant]
  - id: RENT-03
    name: cancel-move-out
    actor: authorized-user
    status: spec_only
    preconditions: [ending-tenancy]
    steps: [cancel-move-out]
    assertions: [tenancy-active, room-occupied]
  - id: RENT-04
    name: confirm-checkout
    actor: operator
    status: spec_only
    preconditions: [ending-tenancy, occupied-room]
    steps: [confirm-checkout]
    assertions: [tenancy-ended, room-vacant, no-direct-active-to-ended, transaction-atomic]

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trooi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trooi_local}
      POSTGRES_DB: ${POSTGRES_DB:-trooi_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_persistence_data:/var/lib/postgresql/data
      - ./database/dev/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trooi} -d ${POSTGRES_DB:-trooi_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - trooi-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-trooi}:${POSTGRES_PASSWORD:-trooi_local}@postgres:5432/${POSTGRES_DB:-trooi_dev}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-trooi}:${POSTGRES_PASSWORD:-trooi_local}@postgres:5432/trooi_test
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - trooi-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-4173}:4173"
    restart: unless-stopped
    networks:
      - trooi-network

networks:
  trooi-network:
    driver: bridge

volumes:
  postgres_persistence_data:

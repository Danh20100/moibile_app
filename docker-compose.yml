# One Compose entrypoint for development, isolated tests and an explicitly enabled finance runtime.
# Default backend connects only to local postgres and NEVER receives production SePay secrets.
# Finance profile requires a separate full-app database and public HTTPS IPN ingress.
x-backend-settings: &backend-settings
  NODE_ENV: production
  PORT: "3000"
  TROOI_BIND_HOST: 0.0.0.0
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  TROOI_EMAIL_AUTH_ENABLED: ${TROOI_EMAIL_AUTH_ENABLED:-false}
  TROOI_OTP_HMAC_SECRET: ${TROOI_OTP_HMAC_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  TROOI_IDENTITY_FOUNDATION_RESOLUTION_ENABLED: ${TROOI_IDENTITY_FOUNDATION_RESOLUTION_ENABLED:-false}
  TROOI_DEMO_CLAIM_USER_ID: ${TROOI_DEMO_CLAIM_USER_ID:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
  OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-false}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-trooi-media}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
  OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
  TROOI_LOCAL_MEDIA_DEMO: ${TROOI_LOCAL_MEDIA_DEMO:-false}
  TROOI_LOCAL_DEMO_AUTH: ${TROOI_LOCAL_DEMO_AUTH:-false}
  REDIS_URL: ${REDIS_URL:-}
  CACHE_ENVIRONMENT: ${CACHE_ENVIRONMENT:-}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
  COMPREFACE_ENABLED: ${COMPREFACE_ENABLED:-false}
  COMPREFACE_ORIGIN: ${COMPREFACE_ORIGIN:-}
  COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-}
  COMPREFACE_TIMEOUT_MS: ${COMPREFACE_TIMEOUT_MS:-15000}
  TROOI_LOCAL_COMPREFACE_LAB: ${TROOI_LOCAL_COMPREFACE_LAB:-false}
  # Explicitly scoped local MVP verification threshold (default 0.90 outside local Compose).
  TROOI_LOCAL_KYC_FACE_THRESHOLD: ${TROOI_LOCAL_KYC_FACE_THRESHOLD:-}
  DEMO_PAYMENT_ENABLED: "false"
  MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
  MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
  MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
  MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn}
  MOMO_IPN_URL: ${MOMO_IPN_URL:-}
  MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-trooi://payment/momo}

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

x-backend-health: &backend-health
  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 40s

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your private .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your private .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?Set POSTGRES_TEST_DB in your private .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_persistence_data:/var/lib/postgresql/data
      - ./database/dev/01-create-test-db.sh:/docker-entrypoint-initdb.d/01-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [trooi-network]

  # Default local KYC runtime. These services share this Compose network with backend,
  # replacing the one-off trooi-verify-lab Compose and manual docker network connect.
  # A separate CompreFace PostgreSQL volume preserves isolation from TrọƠi's account DB.
  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0
    environment:
      POSTGRES_USER: ${TROOI_COMPREFACE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TROOI_COMPREFACE_DB_PASSWORD:?Set TROOI_COMPREFACE_DB_PASSWORD in private .env}
      POSTGRES_DB: ${TROOI_COMPREFACE_DB_NAME:-frs}
    volumes:
      - compreface_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [trooi-network]

  compreface-core:
    image: exadel/compreface-core:1.2.0
    environment:
      ML_PORT: "3000"
      IMG_LENGTH_LIMIT: "640"
      UWSGI_PROCESSES: "2"
      UWSGI_THREADS: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped
    networks: [trooi-network]

  compreface-api:
    image: exadel/compreface-api:1.2.0
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-core:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${TROOI_COMPREFACE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TROOI_COMPREFACE_DB_PASSWORD:?Set TROOI_COMPREFACE_DB_PASSWORD in private .env}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/${TROOI_COMPREFACE_DB_NAME:-frs}
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: "-Xmx4g"
      SAVE_IMAGES_TO_DB: "false"
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 10MB
      CONNECTION_TIMEOUT: "10000"
      READ_TIMEOUT: "60000"
    restart: unless-stopped
    networks: [trooi-network]

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-api:
        condition: service_started
    environment:
      POSTGRES_USER: ${TROOI_COMPREFACE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TROOI_COMPREFACE_DB_PASSWORD:?Set TROOI_COMPREFACE_DB_PASSWORD in private .env}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/${TROOI_COMPREFACE_DB_NAME:-frs}
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: "false"
      EMAIL_HOST: ""
      EMAIL_USERNAME: ""
      EMAIL_FROM: ""
      EMAIL_PASSWORD: ""
      ADMIN_JAVA_OPTS: "-Xmx1g"
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 10MB
    restart: unless-stopped
    networks: [trooi-network]

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    depends_on:
      compreface-api:
        condition: service_started
      compreface-admin:
        condition: service_started
    environment:
      CLIENT_MAX_BODY_SIZE: 10M
      PROXY_READ_TIMEOUT: 60000ms
      PROXY_CONNECT_TIMEOUT: 10000ms
    ports:
      - "127.0.0.1:${TROOI_COMPREFACE_FE_PORT:-18180}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [trooi-network]

  backend:
    image: ${TROOI_BACKEND_IMAGE:-trooi-backend:local}
    build: *backend-build
    depends_on:
      postgres:
        condition: service_healthy
      compreface-fe:
        condition: service_healthy
    environment:
      <<: *backend-settings
      TROOI_DATABASE_MODE: compose-postgres
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your private .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your private .env}
      SEPAY_ENABLED: "false"
    ports:
      # Default localhost-only. Set TROOI_BACKEND_BIND=0.0.0.0 in .env for LAN phone debug.
      - "${TROOI_BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    healthcheck: *backend-health
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [trooi-network]

  # Full application backend backed by a separate, independently managed finance DB.
  # It starts only with --profile finance-production; never depends on dev postgres.
  # The finance URL must resolve from inside this container, not from the host shell.
  finance-backend:
    profiles: [finance-production]
    image: ${TROOI_BACKEND_IMAGE:-trooi-backend:local}
    build: *backend-build
    environment:
      <<: *backend-settings
      TROOI_DATABASE_MODE: external-finance
      DATABASE_URL: ${SEPAY_FINANCE_DATABASE_URL:-}
      SEPAY_ENABLED: ${SEPAY_ENABLED:-false}
      SEPAY_ENVIRONMENT: ${SEPAY_ENVIRONMENT:-}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_IPN_SECRET_KEY: ${SEPAY_IPN_SECRET_KEY:-}
      SEPAY_PUBLIC_BASE_URL: ${SEPAY_PUBLIC_BASE_URL:-}
      SEPAY_HANDOFF_SIGNING_KEY: ${SEPAY_HANDOFF_SIGNING_KEY:-}
      SEPAY_FINANCE_DATABASE: ${SEPAY_FINANCE_DATABASE:-}
    ports:
      # LAN bind for emulator/phone debug (same pattern as main backend).
      - "${TROOI_BACKEND_BIND:-127.0.0.1}:${SEPAY_BACKEND_PORT:-3101}:3000"
    healthcheck: *backend-health
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [trooi-network]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_DEV_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [trooi-network]

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trooi_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in private .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_media_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [trooi-network]

  minio-init:
    image: ${TROOI_BACKEND_IMAGE:-trooi-backend:local}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trooi_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in private .env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-trooi-media}
    entrypoint: ["node"]
    command:
      - "-e"
      - "const {S3Client,CreateBucketCommand}=require('@aws-sdk/client-s3'); const Bucket=process.env.OBJECT_STORAGE_BUCKET; const client=new S3Client({region:'us-east-1',endpoint:'http://minio:9000',forcePathStyle:true,credentials:{accessKeyId:process.env.MINIO_ROOT_USER,secretAccessKey:process.env.MINIO_ROOT_PASSWORD}}); client.send(new CreateBucketCommand({Bucket})).then(()=>process.exit(0)).catch((error)=>{ if(error.name==='BucketAlreadyOwnedByYou'||error.name==='BucketAlreadyExists') process.exit(0); console.error(error.name||error.message); process.exit(1); });"
    restart: "no"
    networks: [trooi-network]

  messaging-postgres:
    profiles: [messaging-test]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${MESSAGING_DB_NAME:-messaging_test}
      POSTGRES_USER: ${MESSAGING_DB_USER:-messaging_test}
      POSTGRES_PASSWORD: ${MESSAGING_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${MESSAGING_DB_PORT:-55447}:5432"
    volumes:
      - messaging_db_data:/var/lib/postgresql/data
    networks: [trooi-network]

  messaging-minio:
    profiles: [messaging-test]
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MESSAGING_MINIO_USER:-messaging-local}
      MINIO_ROOT_PASSWORD: ${MESSAGING_MINIO_PASSWORD:-}
    ports:
      - "127.0.0.1:${MESSAGING_MINIO_PORT:-9047}:9000"
      - "127.0.0.1:${MESSAGING_MINIO_CONSOLE_PORT:-9048}:9001"
    volumes:
      - messaging_media_data:/data
    networks: [trooi-network]

  # Disposable test DB only. Does not point at any historical settlement volume.
  sepay-postgres:
    profiles: [sepay-isolated]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trooi_sepay
      POSTGRES_PASSWORD: ${TROOI_STANDALONE_DB_PASSWORD:-}
      POSTGRES_DB: trooi_sepay_isolated
    ports:
      - "127.0.0.1:${SEPAY_ISOLATED_DB_PORT:-55459}:5432"
    volumes:
      - sepay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trooi_sepay -d trooi_sepay_isolated"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"
    networks: [trooi-network]

networks:
  trooi-network:
    driver: bridge

volumes:
  postgres_persistence_data:
  compreface_postgres_data:
  minio_media_data:
  messaging_db_data:
  messaging_media_data:
  sepay_postgres_data:

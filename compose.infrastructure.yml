# OPTIONAL local development services.
# Run alongside docker-compose.yml, not as a standalone compose project:
# docker compose -f docker-compose.yml -f compose.infrastructure.yml --profile local-infra up -d --no-deps minio redis
# This does NOT enable an application storage/Redis adapter.
services:
  redis:
    profiles: [local-infra]
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_DEV_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - trooi-network

  minio:
    profiles: [local-infra]
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER for local MinIO}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD for local MinIO}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_media_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - trooi-network

volumes:
  minio_media_data:
